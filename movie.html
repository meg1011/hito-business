<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画 | hito&hito</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DR0Z5QNXXR"></script>
  <script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #faf8f5;
      color: #3a3530;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9rem 5vw 6rem;
    }

    /* ===== NAV ===== */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 3rem;
      background: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e8e3dc;
    }
    .nav-logo {
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: #3a3530;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: #6b6460;
      font-size: 1rem;
      letter-spacing: 0.12em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #3a3530; }
    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      z-index: 101;
    }
    .nav-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: #3a3530;
      transition: 0.25s;
    }
    @media (max-width: 600px) {
      nav { padding: 1rem 1.2rem; }
      .nav-toggle { display: flex; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0; right: 0;
        flex-direction: column;
        background: rgba(250,248,245,0.98);
        border-bottom: 1px solid #e8e3dc;
        padding: 0.5rem 0;
        gap: 0;
        list-style: none;
      }
      .nav-links.open { display: flex; }
      .nav-links li { border-top: 1px solid #f0ebe4; }
      .nav-links a { display: block; padding: 0.9rem 1.5rem; font-size: 1rem; }
    }
    .section-label {
      font-size: 14.5px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
      letter-spacing: 0.2em;
      color: #b5afa8;
      margin-bottom: 0.8rem;
      text-align: center;
    }
    .page-title {
      font-size: 1.9rem;
      color: #3a3530;
      letter-spacing: 0.1em;
      margin-bottom: 2.5rem;
      text-align: center;
      font-weight: 400;
    }
    .video-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }
    .video-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }
    @media (max-width: 700px) {
      .video-grid { grid-template-columns: 1fr; }
    }
    .back-link {
      display: inline-block;
      margin-top: 3rem;
      font-size: 1rem;
      color: #6b6460;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-bottom: 1px solid #c8c2ba;
      padding-bottom: 0.2rem;
    }
    .back-link:hover { color: #3a3530; }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="hito&hito_3.png" alt="hito&hito" style="height: 44px; width: auto;" onerror="this.style.display='none'; this.nextSibling.style.display='inline';">
      <span style="display:none;">hito&amp;hito</span>
    </a>
    <button class="nav-toggle" id="menuBtn" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#works">WORKS</a></li>
      <li><a href="index.html#about">ABOUT</a></li>
      <li><a href="index.html#services">SERVICES</a></li>
      <li><a href="index.html#contact">CONTACT</a></li>
    </ul>
  </nav>

  <p class="section-label">Movie</p>
  <h1 class="page-title">動画</h1>
  <div class="video-grid">
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/2Xh1KhymFGc" title="hito&hito 動画1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
    </div>
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/DBYLwUUYUZw" title="hito&hito 動画2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
    </div>
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/VNxO781JUHE" title="hito&hito 動画3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
    </div>
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/jXYm9iTYPa8" title="hito&hito 動画4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>
  <a href="index.html" class="back-link">← トップへ戻る</a>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const navLinks = document.getElementById('navLinks');
    menuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('open');
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => navLinks.classList.remove('open'));
    });
  </script>
</body>
</html>
